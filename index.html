<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Kehadiran SKI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --primary: #0F766E;  
            --primary-light: #CCFBF1; 
            --bg-color: #F1F5F9; 
            --card-bg: #FFFFFF; 
            --text-main: #1E293B; 
            --text-muted: #64748B; 
            --border: #CBD5E1; 
            --success: #10B981; 
        } 
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; } 
         
        html, body {  
            width: 100%;
            min-height: 100dvh; 
            background-color: var(--bg-color);  
            color: var(--text-main);  
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 16px;
            overflow-x: hidden;
        } 
 
        .container {  
            width: 100%;  
            max-width: 440px;  
            background: var(--card-bg);  
            border-radius: 16px;  
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);  
            display: flex; 
            flex-direction: column; 
            border: 1px solid var(--border);  
            overflow: hidden; 
        } 
 
        .header {  
            background: linear-gradient(135deg, #0F766E 0%, #115E59 100%);  
            color: white;  
            padding: 20px 16px;  
            text-align: center; 
        } 
        .header h1 { font-size: 17px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; } 
        .header p { font-size: 12px; opacity: 0.9; } 
 
        .content {  
            padding: 20px 16px;  
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        } 
         
        .form-group { text-align: left; } 
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 12.5px; color: var(--text-main); } 
        .form-group select, .form-group input { 
            width: 100%; 
            padding: 11px 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 13.5px; 
            outline: none; 
            background-color: #FFFFFF; 
            color: var(--text-main); 
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        } 
        .form-group select:focus, .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12); } 
        .form-group select:disabled { background-color: #F8FAFC; cursor: not-allowed; color: var(--text-muted); }

        .status-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 2px; } 
        .status-card { border: 1px solid var(--border); border-radius: 8px; padding: 11px; text-align: center; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-muted); transition: all 0.2s; background: #FFF; } 
        .status-card:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); } 
        .status-card.active { border-color: var(--primary); background: var(--primary-light); color: #042F2E; box-shadow: 0 0 0 2px var(--primary); } 
 
        .btn { background-color: var(--primary); color: white; border: none; padding: 13px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; } 
        .btn:hover { background-color: #115E59; } 
        .btn:disabled { background-color: #E2E8F0; color: #94A3B8; cursor: not-allowed; } 
         
        .success-box { display: none; text-align: center; padding: 20px 0; } 
        .success-icon { font-size: 48px; color: var(--success); margin-bottom: 10px; } 
        .success-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; } 
        .success-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; line-height: 1.5; } 
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-clipboard-user"></i> Absensi Kehadiran SKI</h1>
        <p>Silakan lengkapi data kehadiran Anda</p>
    </div>
     
    <div class="content">
        <!-- Form Absen -->
        <div id="form-section">
            <!-- 1. Pilih Kelas -->
            <div class="form-group">
                <label for="student-class"><i class="fa-solid fa-school" style="color: var(--primary);"></i> Pilih Kelas</label>
                <select id="student-class" onchange="handleClassChange()">
                    <option value="" disabled selected>-- Pilih Kelas Anda --</option>
                    <option value="VII A">Kelas VII A</option>
                    <option value="VII B">Kelas VII B</option>
                    <option value="VIII A">Kelas VIII A</option>
                    <option value="VIII B">Kelas VIII B</option>
                    <option value="IX A">Kelas IX A</option>
                    <option value="IX B">Kelas IX B</option>
                </select>
            </div>

            <!-- 2. Pilih Nama Siswa -->
            <div class="form-group" style="margin-top: 10px;">
                <label for="student-name"><i class="fa-solid fa-user-graduate" style="color: var(--primary);"></i> Pilih Nama Siswa</label>
                <select id="student-name" onchange="checkFormValidity()" disabled>
                    <option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- 3. Pilih Materi / Bab -->
            <div class="form-group" style="margin-top: 10px;">
                <label for="student-materi"><i class="fa-solid fa-book-open" style="color: var(--primary);"></i> Pilih Materi / Bab</label>
                <select id="student-materi" onchange="checkFormValidity()" disabled>
                    <option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- 4. Keterangan Kehadiran -->
            <div class="form-group" style="margin-top: 10px;">
                <label style="margin-bottom: 6px;"><i class="fa-solid fa-circle-check" style="color: var(--primary);"></i> Keterangan Kehadiran</label>
                <div class="status-options">
                    <div class="status-card" onclick="selectStatus('Hadir', this)">Hadir</div>
                    <div class="status-card" onclick="selectStatus('Sakit', this)">Sakit</div>
                    <div class="status-card" onclick="selectStatus('Izin', this)">Izin</div>
                </div>
            </div>

            <button class="btn" id="submit-btn" onclick="submitAttendance()" style="margin-top: 16px;" disabled>
                <i class="fa-solid fa-paper-plane"></i> Kirim Absensi
            </button>
        </div>

        <!-- Tampilan Sukses -->
        <div id="success-section" class="success-box">
            <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div class="success-title">Absensi Berhasil Tercatat!</div>
            <p class="success-desc" id="success-msg">Terima kasih, kehadiranmu sudah direkam ke dalam sistem.</p>
            <button class="btn" onclick="resetForm()"><i class="fa-solid fa-rotate-right"></i> Absen Lagi / Kembali</button>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUQCG12lluDsM-UhY4SsZMZcgh5xbf4dE8FgwrK8xLoyqwwWVtc9D6j8za52ntMBsU/exec';

    // Daftar materi sesuai permintaan lengkap
    const materiPerPelajaran = {
        "7": [
            "Bab 1 : Dakwah Nabi Muhammad SAW di Makkah",
            "Bab 2 : Dakwah Nabi Muhammad SAW di Madinah",
            "Bab 3 : Kepemimpinan Khulafaurrasyidin",
            "Bab 4 : Daulah Umayyah",
            "Bab 5 : Gaya Kepemimpinan Umar bin Abdul Aziz"
        ],
        "8": [
            "Bab 1 : Sejarah Peradaban Islam Pada Masa Daulah Abbasiyah",
            "Bab 2 : Peran Ilmuan Muslim Dan Ulama Terhadap Peradaban Islam Pada Masa Daulah Abbasiyah",
            "Bab 3 : Daulah Ayyubiyah: Cinta Tanah Air Dan Semangat Persatuan Umat",
            "Bab 4 : Pemimpin Dan Ilmuwan Daulah Ayyubiyah: Teladan Cinta Dalam Karya",
            "Bab 5 : Daulah Mamluk: Benteng Peradaban Islam Dengan Semangat Cinta Dan Keberanian"
        ],
        "9": [
            "Bab 1 : Sejarah Islam di Indonesia",
            "Bab 2 : Kerajaan Islam di Indonesia",
            "Bab 3 : Peran Pesantren dalam Dakwah Islam di Indonesia",
            "Bab 4 : Nilai-Nilai Islam dan Kearifan Lokal",
            "Bab 5 : Walisanga dalam Dakwah Islam di Indonesia",
            "Bab 6 : Syaikh Abdur Rauf As-Singkili & Syaikh Muhammad Arsyad Al-Banjari",
            "Bab 7 : Pendiri Organisasi Keagamaan di Indonesia"
        ]
    };

    let globalStudentsData = [];
    let selectedStatusValue = "";

    // Ambil data siswa dari Google Sheets secara asynchronous di latar belakang
    window.addEventListener("DOMContentLoaded", () => {
        fetch(SCRIPT_URL + '?action=getStudents')
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    globalStudentsData = data;
                    updateClassDropdownFromSheets();
                }
            })
            .catch(error => {
                console.log("Menggunakan daftar kelas default lokal.");
            });
    });

    function updateClassDropdownFromSheets() {
        const classSelect = document.getElementById("student-class");
        let uniqueClasses = [...new Set(globalStudentsData.map(s => s.kelas))].sort();
        
        if (uniqueClasses.length > 0) {
            classSelect.innerHTML = '<option value="" disabled selected>-- Pilih Kelas Anda --</option>';
            uniqueClasses.forEach(cls => {
                let opt = document.createElement("option");
                opt.value = cls;
                opt.textContent = cls;
                classSelect.appendChild(opt);
            });
        }
    }

    function getLevelKey(cls) {
        if (!cls) return "8";
        let c = cls.toString().toUpperCase();
        if (c.includes("VII")) return "7";
        if (c.includes("VIII")) return "8";
        if (c.includes("IX")) return "9";
        if (c.includes("7")) return "7";
        if (c.includes("8")) return "8";
        if (c.includes("9")) return "9";
        return "8";
    }

    function handleClassChange() {
        const classVal = document.getElementById("student-class").value;
        const nameSelect = document.getElementById("student-name");
        const materiSelect = document.getElementById("student-materi");
        
        // 1. Setup Nama Siswa
        nameSelect.innerHTML = '<option value="" disabled selected>-- Pilih Nama Anda --</option>';
        nameSelect.disabled = true;

        if (classVal) {
            let filteredStudents = globalStudentsData.filter(s => s.kelas === classVal);
            filteredStudents.sort((a, b) => a.nama.localeCompare(b.nama));

            if (filteredStudents.length > 0) {
                filteredStudents.forEach(student => {
                    let opt = document.createElement("option");
                    opt.value = student.nama;
                    opt.textContent = student.nama;
                    nameSelect.appendChild(opt);
                });
            } else {
                // Fallback jika data siswa di sheet belum termuat sempurna
                let opt = document.createElement("option");
                opt.value = "Siswa " + classVal;
                opt.textContent = "Suaikan Nama di Spreadsheet";
                nameSelect.appendChild(opt);
            }
            nameSelect.disabled = false;

            // 2. Setup Materi Otomatis Berdasarkan Kelas
            let tingkat = getLevelKey(classVal);
            let listMateri = materiPerPelajaran[tingkat] || [];
            
            materiSelect.innerHTML = '<option value="" disabled selected>-- Pilih Materi Pembelajaran --</option>';
            listMateri.forEach(materi => {
                let opt = document.createElement("option");
                opt.value = materi;
                opt.textContent = materi;
                materiSelect.appendChild(opt);
            });
            materiSelect.disabled = false;
        } else {
            materiSelect.innerHTML = '<option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>';
            materiSelect.disabled = true;
        }

        checkFormValidity();
    }

    function selectStatus(status, element) {
        document.querySelectorAll(".status-card").forEach(el => el.classList.remove("active"));
        element.classList.add("active");
        selectedStatusValue = status;
        checkFormValidity();
    }

    function checkFormValidity() {
        const name = document.getElementById("student-name").value;
        const studentClass = document.getElementById("student-class").value;
        const studentMateri = document.getElementById("student-materi").value;
        const btn = document.getElementById("submit-btn");

        if (name && studentClass && studentMateri && selectedStatusValue) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    function submitAttendance() {
        const name = document.getElementById("student-name").value;
        const studentClass = document.getElementById("student-class").value;
        const materi = document.getElementById("student-materi").value;
        const btn = document.getElementById("submit-btn");

        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...`;
        btn.disabled = true;

        const payload = {
            action: 'absensi',
            name: name,
            class: studentClass,
            materi: materi,
            status: selectedStatusValue
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById("form-section").style.display = "none";
            document.getElementById("success-section").style.display = "block";
            document.getElementById("success-msg").innerHTML = `Terima kasih <strong>${name}</strong> (Kelas <strong>${studentClass}</strong>), kehadiran untuk materi <em>"${materi}"</em> berhasil disimpan ke sistem.`;
        }).catch(err => {
            alert("Terjadi kesalahan koneksi. Silakan coba lagi.");
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Kirim Absensi`;
            btn.disabled = false;
        });
    }

    const resetForm = () => {
        document.getElementById("student-class").selectedIndex = 0;
        
        const nameSelect = document.getElementById("student-name");
        nameSelect.innerHTML = '<option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>';
        nameSelect.disabled = true;

        const materiSelect = document.getElementById("student-materi");
        materiSelect.innerHTML = '<option value="" disabled selected>-- Pilih Kelas Terlebih Dahulu --</option>';
        materiSelect.disabled = true;
        
        document.querySelectorAll(".status-card").forEach(el => el.classList.remove("active"));
        selectedStatusValue = "";
        
        const btn = document.getElementById("submit-btn");
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Kirim Absensi`;
        btn.disabled = true;
        
        document.getElementById("success-section").style.display = "none";
        document.getElementById("form-section").style.display = "block";
    }
</script>
</body>
</html>
